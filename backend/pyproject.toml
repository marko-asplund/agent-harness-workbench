[project]
name = "agent-harness-workbench"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "marko asplund", email = "1002541+marko-asplund@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "deepagents>=0.7.31",
    "httpx>=0.28.1",
    "langchain>=1.4.7",
    "langchain-mistralai>=1.1.6",
    "langgraph>=1.2.16",
    "langgraph-cli[inmem]>=0.4.37",
    "langgraph-sdk>=0.4.8",
    "python-dotenv>=1.2.4",
]

[project.scripts]
agent-harness-workbench = "app:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
